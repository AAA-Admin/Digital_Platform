<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAA Preloader — Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #060402; }

    #overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #060402;
      display: flex; align-items: center; justify-content: center;
    }
    #stage { position: relative; width: 0; height: 0; }

    .ring, .ghost, .logo-wrap, .tiny-ghost {
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    #wordmark {
      position: absolute;
      left: 0;
      top: -46px;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 5rem;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: -0.02em;
      display: flex;
      align-items: flex-end;
      opacity: 0;
    }
    #wordmark span { display: inline-block; }

    #replay-btn {
      position: fixed; bottom: 24px; right: 24px; z-index: 99999;
      background: rgba(0,173,238,0.12);
      border: 1px solid rgba(0,173,238,0.35);
      color: #00ADEE;
      font-family: sans-serif; font-size: 13px;
      padding: 8px 18px; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    #replay-btn:hover { background: rgba(0,173,238,0.22); }
  </style>

      <!-- Main logo — rounded paths, brand blue -->

      <!-- Wordmark -->

  </div>

  <button id="replay-btn" onclick="replay()">↺ Replay</button>

  <script>
    const WORDMARK = 'AAA Events';
    const LOGO_SIZE = 140;

    const wordmarkEl = document.getElementById('wordmark');
    WORDMARK.split('').forEach(char => {
      const span = document.createElement('span');
      span.className = 'pl-letter';
      span.textContent = char === ' ' ? '\u00A0' : char;
      wordmarkEl.appendChild(span);
    });

    let currentTl = null;

    function runAnimation() {
      const overlay  = document.getElementById('overlay');
      const logo     = document.getElementById('main-logo');
      const ghost1   = document.getElementById('ghost1');
      const ghost2   = document.getElementById('ghost2');
      const ring1    = document.getElementById('ring1');
      const ring2    = document.getElementById('ring2');
      const ring3    = document.getElementById('ring3');
      const ring4    = document.getElementById('ring4');
      const ring5    = document.getElementById('ring5');
      const tinyApex = document.getElementById('tiny-apex');
      const tinyBL   = document.getElementById('tiny-bl');
      const tinyBR   = document.getElementById('tiny-br');
      const wordmark = document.getElementById('wordmark');
      const letters  = Array.from(wordmark.querySelectorAll('.pl-letter'));

      // Measure wordmark width for lockup positioning
      gsap.set(wordmark, { x: 0, opacity: 1, y: 0 });
      const textW = wordmark.offsetWidth;
      const gap = 24;
      const totalW = LOGO_SIZE + gap + textW;
      const logoFinalX = -(totalW / 2 - LOGO_SIZE / 2);
      const textFinalX =  logoFinalX + LOGO_SIZE / 2 + gap;

      // Reset
      gsap.set(overlay,  { opacity: 1, display: 'flex' });
      gsap.set(logo,     { scale: 4.2, opacity: 0, filter: 'brightness(0.05)', x: 0, y: 0 });
      gsap.set(ghost1,   { scale: 0, opacity: 0, x: 0, y: 0 });
      gsap.set(ghost2,   { scale: 0, opacity: 0, x: 0, y: 0 });
      gsap.set([ring1, ring2, ring3, ring4, ring5], { scale: 0.22, opacity: 0 });
      gsap.set([tinyApex, tinyBL, tinyBR], { scale: 0, opacity: 0 });
      gsap.set(wordmark, { x: textFinalX, opacity: 0, y: 0 });
      // rotateY card-flip start: each letter is edge-on (vertical sliver)
      letters.forEach(l => gsap.set(l, { rotateY: 90, opacity: 0, transformOrigin: '50% 50%', transformPerspective: 350 }));

      const tl = gsap.timeline();
      currentTl = tl;

      // Phase 1: Logo materialises (0 → 0.85s)
      tl.to(logo, { scale: 1, opacity: 1, filter: 'brightness(1)', duration: 0.85, ease: 'power2.out' });

      // Phase 2: Five overlapping rings — slow, thick, clearly visible
      // Each ring expands 0.80s, stagger 0.22s. Ring 1: 0.85-1.65  Ring 5: 1.73-2.53
      const rings = [ring1, ring2, ring3, ring4, ring5];
      rings.forEach((ring, i) => {
        tl.fromTo(ring,
          { scale: 0.22, opacity: 1.0 },
          { scale: 3.8, opacity: 0, duration: 0.80, ease: 'power2.out' },
          0.85 + i * 0.22
        );
      });

      // Tiny ghost triangles grow parallel with rings 4-5 fading (~2.10s)
      const tinyT = 2.10;
      [
        { el: tinyApex, dt: 0.00 },
        { el: tinyBL,   dt: 0.06 },
        { el: tinyBR,   dt: 0.06 },
      ].forEach(({ el, dt }) => {
        tl.fromTo(el,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 0.65, duration: 0.30, ease: 'power2.out' },
          tinyT + dt
        );
        tl.to(el, { opacity: 0, scale: 0.4, duration: 0.22, ease: 'power2.in' }, tinyT + dt + 0.38);
      });

      // Phase 3: Ghost pop (2.65 → 3.1s)
      tl.to(logo,   { scale: 1.16, duration: 0.10, ease: 'power3.out' }, 2.65);
      tl.to(logo,   { scale: 1.00, duration: 0.24, ease: 'power2.inOut' }, 2.75);
      tl.fromTo(ghost1,
        { scale: 0, opacity: 0, x: -40, y: 32 },
        { scale: 0.76, opacity: 1, x: -115, y: 88, duration: 0.36, ease: 'back.out(2.4)' }, 2.68);
      tl.fromTo(ghost2,
        { scale: 0, opacity: 0, x: 40, y: -32 },
        { scale: 0.76, opacity: 1, x: 115, y: -88, duration: 0.36, ease: 'back.out(2.4)' }, 2.68);

      // Phase 4a: Ghosts drift vertically (3.15 → 4.35s)
      tl.to(ghost1, { x: -50, y: 230, scale: 0.52, opacity: 0.55, duration: 1.2, ease: 'power1.inOut' }, 3.15);
      tl.to(ghost2, { x: 50, y: -230, scale: 0.52, opacity: 0.55, duration: 1.2, ease: 'power1.inOut' }, 3.15);

      // Phase 4b: Ghosts converge back — absorbed (4.35 → 5.15s)
      tl.to(ghost1, { x: 0, y: 0, scale: 0.15, opacity: 0, duration: 0.80, ease: 'power2.in' }, 4.35);
      tl.to(ghost2, { x: 0, y: 0, scale: 0.15, opacity: 0, duration: 0.80, ease: 'power2.in' }, 4.35);

      // Logo micro-pulse on absorption
      tl.to(logo, { scale: 1.10, duration: 0.12, ease: 'power2.out' }, 5.05);
      tl.to(logo, { scale: 1.00, duration: 0.20, ease: 'power2.inOut' }, 5.17);

      // Phase 5: Compose (5.37 → 7.2s)
      tl.to(logo,   { x: logoFinalX, duration: 0.65, ease: 'power2.inOut' }, 5.37);
      tl.set(wordmark, { opacity: 1 }, 5.59);
      // rotateY card-flip reveal: each letter swings from edge-on to facing forward
      // Large stagger = trailing letters still vertical slivers while leaders are settled
      tl.to(letters, {
        rotateY: 0, opacity: 1,
        duration: 0.52, stagger: 0.13, ease: 'power3.out',
        transformOrigin: '50% 50%', transformPerspective: 350,
      }, 5.61);

      // Phase 6: Text fades, logo flies away
      tl.to(wordmark, { opacity: 0, y: -10, duration: 0.25, ease: 'power2.in' }, 7.20);
      tl.to(logo,     { opacity: 0, duration: 0.30, ease: 'power2.in' }, 7.50);

      // Phase 7: Overlay out
      tl.to(overlay, { opacity: 0, duration: 0.45, ease: 'power2.inOut' }, 8.15);
    }

    function replay() {
      if (currentTl) { currentTl.kill(); currentTl = null; }
      gsap.killTweensOf('*');
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('overlay').style.opacity = '1';
      runAnimation();
    }

    window.addEventListener('load', runAnimation);
  </script>
</body>
